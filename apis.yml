name: R2
description: >-
  R2 is an embedded finance platform operating across Latin America (Mexico, Brazil,
  Chile, Colombia and Peru) that lets digital platforms and marketplaces offer
  revenue-based financing to their merchants. Through R2's REST APIs and embeddable
  JavaScript components, partners share merchant and transaction data for credit
  scoring, surface pre-approved offers, run KYC, disburse capital, and reconcile
  sales-based repayments via collections. R2 reports having facilitated over 180,000
  loans and is backed by General Catalyst.
